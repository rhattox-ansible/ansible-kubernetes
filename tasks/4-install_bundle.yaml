- name: Create a temporary working directory for the kubectx installation archive
  ansible.builtin.file:
    path: "/tmp/kubectx"
    state: directory
    mode: "0777"

- name: Download the kubectx utility into the local bin directory
  ansible.builtin.get_url:
    url: "{{ kubectx_url }}"
    dest: "{{ install_path }}/kubectx.tar.gz"
    mode: "0550"
    owner: "{{ ansible_env.SUDO_USER }}"
    group: "{{ ansible_env.SUDO_USER }}"

- name: Extract the kubectx archive contents locally
  ansible.builtin.unarchive:
    src: "/tmp/kubectx/kubectx.tar.gz"
    dest: "/tmp/kubectx"

- name: Create a temporary working directory for the kubens installation archive
  ansible.builtin.file:
    path: "/tmp/kubens"
    state: directory
    mode: "0777"

- name: Download the kubens utility into the local bin directory
  ansible.builtin.get_url:
    url: "{{ kubens_url }}"
    dest: "{{ install_path }}/kubens.tar.gz"
    mode: "0550"
    owner: "{{ ansible_env.SUDO_USER }}"
    group: "{{ ansible_env.SUDO_USER }}"

- name: Extract the kubens archive contents locally
  ansible.builtin.unarchive:
    src: "/tmp/kubens/kubens.tar.gz"
    dest: "/tmp/kubens"

- name: Create a temporary working directory for the Helm installation archive
  ansible.builtin.file:
    path: "/tmp/helm_temp"
    state: directory
    mode: "0777"

- name: Download the Helm release archive to the temporary workspace
  ansible.builtin.get_url:
    url: "{{ helm_url }}"
    dest: "/tmp/helm_temp/helm.tar.gz"
    mode: "0777"

- name: Extract the Helm archive contents locally
  ansible.builtin.unarchive:
    src: "/tmp/helm_temp/helm.tar.gz"
    dest: "/tmp/helm_temp"

- name: Copy the Helm binary into the installation directory for use on the system
  ansible.builtin.copy:
    src: "/tmp/helm_temp/linux-amd64/helm"
    dest: "{{ install_path }}/helm"
    remote_src: true
    owner: "{{ ansible_env.SUDO_USER }}"
    group: "{{ ansible_env.SUDO_USER }}"
    mode: "0550"

- name: Remove the temporary Helm extraction directory after installation
  ansible.builtin.file:
    path: "/tmp/helm_temp"
    state: absent
