- name: Load the br_netfilter kernel module required for Kubernetes networking
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Ensure the br_netfilter module is enabled automatically at boot
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/br_netfilter.conf
    line: br_netfilter
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Configure the kernel networking settings needed by Kubernetes and containerd
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"

- name: Apply the Kubernetes networking sysctl configuration immediately
  ansible.builtin.command: sysctl --system
  changed_when: true
